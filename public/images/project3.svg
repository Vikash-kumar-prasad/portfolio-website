<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="p3-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="p3-alert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="p3-warning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="p3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="600" height="350" rx="12" fill="url(#p3-bg)" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1.5"/>

  <!-- Subtle background grid -->
  <path d="M0 70 H600 M0 140 H600 M0 210 H600 M0 280 H600 M120 0 V350 M240 0 V350 M360 0 V350 M480 0 V350" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Top System Header Bar -->
  <g transform="translate(30, 20)">
    <rect width="540" height="32" rx="6" fill="#111625" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <!-- Live Recording Indicator -->
    <circle cx="20" cy="16" r="4" fill="#ef4444" filter="url(#p3-glow)"/>
    <text x="32" y="20" fill="#ffffff" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE CCTV FEED // CAM-04</text>
    <text x="210" y="20" fill="#71717a" font-family="'Geist', monospace, sans-serif" font-size="10">FPS: 30.2</text>
    <text x="270" y="20" fill="#71717a" font-family="'Geist', monospace, sans-serif" font-size="10">LATENCY: 14ms</text>
    
    <!-- Model status tag -->
    <rect x="365" y="7" width="85" height="18" rx="9" fill="rgba(0, 212, 255, 0.1)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1"/>
    <text x="407" y="19" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="9" font-weight="600" text-anchor="middle">YOLOv8 + FLOW</text>

    <!-- Threat Status tag -->
    <rect x="460" y="7" width="70" height="18" rx="9" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
    <text x="495" y="19" fill="#34d399" font-family="'Geist', monospace, sans-serif" font-size="9" font-weight="600" text-anchor="middle">STATUS: SECURE</text>
  </g>

  <!-- Left Side: Vision Analytics Viewport -->
  <g transform="translate(30, 62)">
    <!-- Viewport Screen Window -->
    <rect width="340" height="260" rx="8" fill="#090d16" stroke="rgba(0, 212, 255, 0.25)" stroke-width="1.2"/>
    
    <!-- CCTV Grid scan lines -->
    <path d="M0 65 H340 M0 130 H340 M0 195 H340 M85 0 V260 M170 0 V260 M255 0 V260" stroke="rgba(0, 212, 255, 0.04)" stroke-width="1"/>

    <!-- Viewfinder Reticles (Corners) -->
    <path d="M12 24 V12 H24 M316 12 H328 V24 M12 236 V248 H24 M316 248 H328 V236" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Center HUD crosshair -->
    <circle cx="170" cy="130" r="16" fill="none" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="170" y1="108" x2="170" y2="152" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1"/>
    <line x1="148" y1="130" x2="192" y2="130" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1"/>

    <!-- Person 1: Detected Crowd Target (Head Bounding Box) -->
    <g transform="translate(55, 75)">
      <!-- Head box -->
      <rect width="40" height="42" rx="3" fill="rgba(0, 212, 255, 0.08)" stroke="#00d4ff" stroke-width="1.5"/>
      <rect x="0" y="-14" width="55" height="14" rx="2" fill="#00d4ff"/>
      <text x="4" y="-3" fill="#090d16" font-family="'Geist', monospace, sans-serif" font-size="8" font-weight="700">HEAD 0.96</text>
      <!-- Optical flow vector -->
      <line x1="20" y1="21" x2="35" y2="28" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <polygon points="35,28 30,25 32,30" fill="#38bdf8"/>
    </g>

    <!-- Person 2: Detected Crowd Target Center -->
    <g transform="translate(145, 95)">
      <!-- Head box -->
      <rect width="44" height="46" rx="3" fill="rgba(0, 212, 255, 0.08)" stroke="#00d4ff" stroke-width="1.5"/>
      <rect x="0" y="-14" width="55" height="14" rx="2" fill="#00d4ff"/>
      <text x="4" y="-3" fill="#090d16" font-family="'Geist', monospace, sans-serif" font-size="8" font-weight="700">HEAD 0.94</text>
      <!-- Optical flow vector -->
      <line x1="22" y1="23" x2="36" y2="16" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <polygon points="36,16 31,18 33,13" fill="#38bdf8"/>
    </g>

    <!-- Person 3: Monitored Threat/Weapon Area (High Confidence) -->
    <g transform="translate(235, 60)">
      <!-- Head box -->
      <rect width="38" height="40" rx="3" fill="rgba(0, 212, 255, 0.08)" stroke="#00d4ff" stroke-width="1.5"/>
      <rect x="0" y="-14" width="55" height="14" rx="2" fill="#00d4ff"/>
      <text x="4" y="-3" fill="#090d16" font-family="'Geist', monospace, sans-serif" font-size="8" font-weight="700">HEAD 0.91</text>
      <!-- Body proximity weapon scan box -->
      <rect x="-8" y="44" width="54" height="60" rx="3" fill="rgba(245, 158, 11, 0.05)" stroke="rgba(245, 158, 11, 0.7)" stroke-width="1.2" stroke-dasharray="2,2"/>
      <rect x="-8" y="106" width="62" height="13" rx="2" fill="#d97706"/>
      <text x="-4" y="116" fill="#ffffff" font-family="'Geist', monospace, sans-serif" font-size="7.5" font-weight="700">SCAN: CLEAR</text>
    </g>

    <!-- Person 4: Background Head -->
    <g transform="translate(100, 160)">
      <rect width="36" height="38" rx="3" fill="rgba(0, 212, 255, 0.06)" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.7"/>
      <rect x="0" y="-12" width="50" height="12" rx="2" fill="rgba(0, 212, 255, 0.8)"/>
      <text x="4" y="-3" fill="#090d16" font-family="'Geist', monospace, sans-serif" font-size="7.5" font-weight="700">HEAD 0.89</text>
    </g>

    <!-- Person 5: Background Head -->
    <g transform="translate(195, 165)">
      <rect width="34" height="36" rx="3" fill="rgba(0, 212, 255, 0.06)" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.7"/>
      <rect x="0" y="-12" width="50" height="12" rx="2" fill="rgba(0, 212, 255, 0.8)"/>
      <text x="4" y="-3" fill="#090d16" font-family="'Geist', monospace, sans-serif" font-size="7.5" font-weight="700">HEAD 0.88</text>
    </g>

    <!-- Viewport Bottom HUD overlay -->
    <rect y="226" width="340" height="34" rx="0 0 8 8" fill="#0c111d" fill-opacity="0.9" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="14" y="247" fill="#a1a1aa" font-family="'Geist', monospace, sans-serif" font-size="9">CROWD COUNT: <tspan fill="#00d4ff" font-weight="700">5 DETECTED</tspan></text>
    <text x="190" y="247" fill="#a1a1aa" font-family="'Geist', monospace, sans-serif" font-size="9">FLOW MAGNITUDE: <tspan fill="#34d399" font-weight="700">0.08 (CALM)</tspan></text>
  </g>

  <!-- Right Side: Real-Time Threat Engine & Telemetry -->
  <g transform="translate(385, 62)">
    <!-- Density Estimation Card -->
    <g transform="translate(0, 0)">
      <rect width="185" height="122" rx="8" fill="#0e1322" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="14" y="20" fill="#71717a" font-family="'Geist', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">SPATIAL DENSITY GRID</text>
      
      <!-- 3x3 Heatmap Grid -->
      <g transform="translate(14, 30)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.2"/>
        <rect x="26" y="0" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.4"/>
        <rect x="52" y="0" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.15"/>
        <!-- Row 2 -->
        <rect x="0" y="26" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.3"/>
        <rect x="26" y="26" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.65"/>
        <rect x="52" y="26" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.25"/>
        <!-- Row 3 -->
        <rect x="0" y="52" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.1"/>
        <rect x="26" y="52" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.35"/>
        <rect x="52" y="52" width="22" height="22" rx="3" fill="#00d4ff" fill-opacity="0.15"/>
      </g>

      <!-- Density Stats -->
      <g transform="translate(100, 32)">
        <text x="0" y="14" fill="#a1a1aa" font-family="'Geist', sans-serif" font-size="8.5">Peak Cell</text>
        <text x="0" y="30" fill="#ffffff" font-family="'Geist', monospace, sans-serif" font-size="14" font-weight="700">0.42 <tspan font-size="9" fill="#71717a">p/m²</tspan></text>
        <text x="0" y="50" fill="#a1a1aa" font-family="'Geist', sans-serif" font-size="8.5">Risk Tier</text>
        <rect x="0" y="56" width="68" height="16" rx="4" fill="rgba(52, 211, 153, 0.15)"/>
        <text x="34" y="67" fill="#34d399" font-family="'Geist', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">LOW RISK</text>
      </g>
    </g>

    <!-- Emergency Dispatch & Threat Assessment Card -->
    <g transform="translate(0, 134)">
      <rect width="185" height="126" rx="8" fill="#0e1322" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="14" y="20" fill="#71717a" font-family="'Geist', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">THREAT ENGINE LOG</text>
      
      <!-- Event Rows -->
      <g transform="translate(14, 30)">
        <!-- Event 1 -->
        <circle cx="4" cy="9" r="3" fill="#34d399"/>
        <text x="12" y="12" fill="#e4e4e7" font-family="'Geist', monospace, sans-serif" font-size="8.5">Grid check: Normal</text>
        <text x="125" y="12" fill="#71717a" font-family="'Geist', monospace, sans-serif" font-size="7.5">14:28:10</text>
        <line x1="0" y1="20" x2="155" y2="20" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

        <!-- Event 2 -->
        <circle cx="4" cy="30" r="3" fill="#00d4ff"/>
        <text x="12" y="33" fill="#e4e4e7" font-family="'Geist', monospace, sans-serif" font-size="8.5">Optical Flow: 0.08</text>
        <text x="125" y="33" fill="#71717a" font-family="'Geist', monospace, sans-serif" font-size="7.5">14:28:18</text>
        <line x1="0" y1="41" x2="155" y2="41" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

        <!-- Event 3 -->
        <circle cx="4" cy="51" r="3" fill="#34d399"/>
        <text x="12" y="54" fill="#e4e4e7" font-family="'Geist', monospace, sans-serif" font-size="8.5">Weapon Scan: 0 flag</text>
        <text x="125" y="54" fill="#71717a" font-family="'Geist', monospace, sans-serif" font-size="7.5">14:28:24</text>
      </g>

      <!-- Automated Dispatch Badge -->
      <rect x="14" y="94" width="157" height="20" rx="4" fill="rgba(0, 212, 255, 0.08)" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1"/>
      <text x="92" y="107" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">CAD DISPATCH READY</text>
    </g>
  </g>
</svg>
