<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="p1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="p1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="12" fill="url(#p1-bg)" stroke="rgba(0, 212, 255, 0.2)" stroke-width="1.5"/>

  <!-- Grid overlay -->
  <path d="M0 70 H600 M0 140 H600 M0 210 H600 M0 280 H600 M120 0 V350 M240 0 V350 M360 0 V350 M480 0 V350" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Left: Document Preview (Invoice Mockup) -->
  <g transform="translate(40, 45)">
    <!-- Document Card -->
    <rect width="210" height="260" rx="8" fill="#121624" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Top bar -->
    <rect x="15" y="15" width="40" height="10" rx="3" fill="url(#p1-accent)"/>
    <rect x="140" y="15" width="55" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>
    <!-- Invoice text lines -->
    <rect x="15" y="38" width="180" height="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="15" y="52" width="70" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="15" y="66" width="110" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="15" y="78" width="90" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>
    <!-- Table Mockup -->
    <rect x="15" y="100" width="180" height="75" rx="4" fill="#0d101a" stroke="rgba(255,255,255,0.06)"/>
    <rect x="25" y="112" width="50" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="145" y="112" width="40" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="25" y="128" width="70" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="155" y="128" width="30" height="4" rx="2" fill="#00d4ff"/>
    <rect x="25" y="142" width="60" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="155" y="142" width="30" height="4" rx="2" fill="#00d4ff"/>
    <rect x="25" y="156" width="65" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="155" y="156" width="30" height="4" rx="2" fill="#00d4ff"/>
    <!-- OCR Scan Line Animation effect -->
    <line x1="10" y1="135" x2="200" y2="135" stroke="#00d4ff" stroke-width="2" opacity="0.8" filter="url(#p1-glow)"/>
    <rect x="15" y="190" width="180" height="50" rx="4" fill="rgba(0, 212, 255, 0.05)" stroke="rgba(0, 212, 255, 0.2)" stroke-dasharray="3,3"/>
    <text x="105" y="218" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">OCR EXTRACTING</text>
  </g>

  <!-- Center Arrow / Pipeline -->
  <g transform="translate(265, 160)">
    <circle cx="15" cy="15" r="22" fill="#121624" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.5"/>
    <path d="M10 15 H20 M16 11 L20 15 L16 19" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="-14" fill="#00d4ff" font-family="'Geist', sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">GROQ LLM</text>
  </g>

  <!-- Right: JSON Schema Output Card -->
  <g transform="translate(325, 45)">
    <rect width="235" height="260" rx="8" fill="#0b0e17" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1"/>
    <!-- Terminal Header -->
    <rect width="235" height="30" rx="8" fill="#141926"/>
    <circle cx="18" cy="15" r="4" fill="#ff5f56"/>
    <circle cx="32" cy="15" r="4" fill="#ffbd2e"/>
    <circle cx="46" cy="15" r="4" fill="#27c93f"/>
    <text x="125" y="19" fill="rgba(255,255,255,0.5)" font-family="'Geist', monospace, sans-serif" font-size="10" text-anchor="middle">extracted.json</text>

    <!-- Code Display -->
    <text x="18" y="55" fill="#a1a1aa" font-family="'Geist', monospace, sans-serif" font-size="11">{</text>
    <text x="30" y="75" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="11">"invoiceNo"<tspan fill="#e4e4e7">: </tspan><tspan fill="#34d399">"INV-2024-001"</tspan><tspan fill="#e4e4e7">,</tspan></text>
    <text x="30" y="95" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="11">"vendor"<tspan fill="#e4e4e7">: </tspan><tspan fill="#34d399">"Acme Corp"</tspan><tspan fill="#e4e4e7">,</tspan></text>
    <text x="30" y="115" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="11">"total"<tspan fill="#e4e4e7">: </tspan><tspan fill="#f59e0b">1450.00</tspan><tspan fill="#e4e4e7">,</tspan></text>
    <text x="30" y="135" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="11">"currency"<tspan fill="#e4e4e7">: </tspan><tspan fill="#34d399">"USD"</tspan><tspan fill="#e4e4e7">,</tspan></text>
    <text x="30" y="155" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="11">"status"<tspan fill="#e4e4e7">: </tspan><tspan fill="#34d399">"validated"</tspan><tspan fill="#e4e4e7">,</tspan></text>
    <text x="30" y="175" fill="#00d4ff" font-family="'Geist', monospace, sans-serif" font-size="11">"items"<tspan fill="#e4e4e7">: [ ... ]</tspan></text>
    <text x="18" y="195" fill="#a1a1aa" font-family="'Geist', monospace, sans-serif" font-size="11">}</text>

    <!-- Schema Valid Tag -->
    <rect x="25" y="218" width="185" height="26" rx="13" fill="rgba(52, 211, 153, 0.1)" stroke="rgba(52, 211, 153, 0.3)"/>
    <circle cx="42" cy="231" r="4" fill="#34d399"/>
    <text x="120" y="235" fill="#34d399" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">SCHEMA VALIDATED</text>
  </g>
</svg>
